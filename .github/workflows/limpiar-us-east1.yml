# Un solo uso (23-10-2026): borra la copia de las funciones que se publicó en
# us-east1 durante la caída del 22-10 y nunca arrancó. Solo toca us-east1.
# Se elimina este archivo después de correrlo.
name: Limpiar funciones de us-east1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/limpiar-us-east1.yml'

concurrency:
  group: firebase-funciones
  cancel-in-progress: false

jobs:
  limpiar:
    runs-on: ubuntu-latest
    env:
      PROYECTO: innova-950ff
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Lo que hay antes
        run: |
          gcloud functions list --project "$PROYECTO" --format='table(name,environment,state)' || true
          gcloud artifacts repositories list --location us-east1 --project "$PROYECTO" || true

      - name: Borrar las funciones de us-east1
        run: |
          for F in login cambiarPin adminPin crearUsuario migrarPines; do
            if gcloud functions describe "$F" --gen2 --region us-east1 --project "$PROYECTO" >/dev/null 2>&1; then
              gcloud functions delete "$F" --gen2 --region us-east1 --project "$PROYECTO" --quiet
            else
              echo "$F no existe en us-east1"
            fi
          done

      - name: Borrar las imágenes de us-east1
        run: |
          if gcloud artifacts repositories describe gcf-artifacts --location us-east1 --project "$PROYECTO" >/dev/null 2>&1; then
            gcloud artifacts repositories delete gcf-artifacts --location us-east1 --project "$PROYECTO" --quiet
          else
            echo "No hay repositorio de imágenes en us-east1"
          fi

      - name: Lo que queda
        run: gcloud functions list --project "$PROYECTO" --format='table(name,environment,state)'
