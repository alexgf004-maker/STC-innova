# Publica las Cloud Functions de STC-innova (carpeta functions/) cada vez que
# cambian en main. También se puede correr a mano desde la pestaña Actions
# ("Run workflow").
#
# Se publican con gcloud y la imagen base fija al publicar
# (--runtime-update-policy=on-deploy), no con firebase deploy: ese deja la
# base en actualización automática, y el 22-10-2026 ninguna función lograba
# arrancar así (el login estuvo caído de 3:27 a 4:30 pm).
#
# Necesita el secreto FIREBASE_SERVICE_ACCOUNT (JSON de una cuenta de servicio
# del proyecto innova-950ff con rol Propietario). Ver functions/LEEME.md.
name: Publicar funciones de Firebase

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/firebase-funciones.yml'
  workflow_dispatch:

concurrency:
  group: firebase-funciones
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      PROYECTO: innova-950ff
      REGION: us-central1
      FUNCIONES: login cambiarPin adminPin crearUsuario migrarPines
    steps:
      - uses: actions/checkout@v4

      - name: Revisar que exista el secreto
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT (ver functions/LEEME.md)"
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Activar servicios necesarios
        run: |
          gcloud services enable cloudfunctions.googleapis.com cloudbuild.googleapis.com \
            artifactregistry.googleapis.com run.googleapis.com \
            iamcredentials.googleapis.com --project "$PROYECTO"

      - name: Publicar funciones
        run: |
          NUM=$(gcloud projects describe "$PROYECTO" --format='value(projectNumber)')
          printf '%s\n' \
            "FIREBASE_CONFIG: '{\"projectId\":\"$PROYECTO\",\"databaseURL\":\"https://$PROYECTO-default-rtdb.firebaseio.com\",\"storageBucket\":\"$PROYECTO.firebasestorage.app\"}'" \
            "GCLOUD_PROJECT: $PROYECTO" > /tmp/env.yaml
          for F in $FUNCIONES; do
            echo "=== $F ==="
            gcloud functions deploy "$F" --gen2 --region "$REGION" --project "$PROYECTO" \
              --runtime nodejs22 --runtime-update-policy on-deploy \
              --source functions --entry-point "$F" --trigger-http --allow-unauthenticated \
              --memory 256Mi --max-instances 5 --timeout 60s \
              --service-account "$NUM-compute@developer.gserviceaccount.com" \
              --env-vars-file /tmp/env.yaml --quiet
          done

      # Permisos de la cuenta con la que corren las funciones: firmar tokens de
      # acceso (login), leer y escribir Firestore y administrar cuentas de Auth.
      - name: Permisos de las funciones
        run: |
          NUM=$(gcloud projects describe "$PROYECTO" --format='value(projectNumber)')
          SA="$NUM-compute@developer.gserviceaccount.com"
          gcloud iam service-accounts add-iam-policy-binding "$SA" \
            --member="serviceAccount:$SA" --role="roles/iam.serviceAccountTokenCreator" \
            --project "$PROYECTO" >/dev/null
          for ROL in roles/datastore.user roles/firebaseauth.admin; do
            gcloud projects add-iam-policy-binding "$PROYECTO" --member="serviceAccount:$SA" \
              --role="$ROL" --condition=None >/dev/null
          done
          echo "Permisos listos para $SA"

      - name: Probar que el login responde
        run: |
          sleep 20
          R=$(curl -s -X POST "https://$REGION-$PROYECTO.cloudfunctions.net/login" \
            -H 'Content-Type: application/json' -d '{"data":{"username":"prueba-despliegue-github","pin":"0000"}}')
          echo "$R"
          echo "$R" | grep -q 'PERMISSION_DENIED' || { echo "::error::El login no respondió como se esperaba"; exit 1; }
          echo "El login responde bien (rechaza un usuario inventado)."

      # Login correcto de punta a punta con un usuario temporal (se borra al
      # terminar): comprueba que el servidor lee Firestore y firma el token.
      - name: Probar un login correcto
        run: |
          TK=$(gcloud auth print-access-token)
          FS="https://firestore.googleapis.com/v1/projects/$PROYECTO/databases/(default)/documents"
          U=prueba-despliegue-github; TUID=prueba-despliegue-uid; PIN=$(shuf -i 1000-9999 -n 1); SAL=$(openssl rand -hex 16)
          HASH=$(printf '%s' "$SAL$PIN" | sha256sum | cut -d' ' -f1)
          poner() { curl -s -o /dev/null -w '%{http_code} ' -X PATCH "$FS/$1" -H "Authorization: Bearer $TK" -H 'Content-Type: application/json' -d "$2"; }
          borrar() { curl -s -o /dev/null -X DELETE "$FS/$1" -H "Authorization: Bearer $TK"; }
          trap 'borrar usernames/$U; borrar users/$TUID; borrar pins/$TUID' EXIT
          poner "usernames/$U" '{"fields":{"uid":{"stringValue":"'$TUID'"}}}'
          poner "users/$TUID" '{"fields":{"role":{"stringValue":"tecnico"},"active":{"booleanValue":true},"displayName":{"stringValue":"Prueba automatica (se borra sola)"},"username":{"stringValue":"'$U'"}}}'
          poner "pins/$TUID" '{"fields":{"pinHash":{"stringValue":"'$HASH'"},"pinSalt":{"stringValue":"'$SAL'"}}}'
          echo
          R=$(curl -s -X POST "https://$REGION-$PROYECTO.cloudfunctions.net/login" \
            -H 'Content-Type: application/json' -d '{"data":{"username":"'$U'","pin":"'$PIN'"}}')
          echo "$R" | grep -q '"token"' || { echo "$R"; echo "::error::El login correcto no entregó el token"; exit 1; }
          echo "Login correcto: el servidor entregó el token de acceso."

      - name: Las demás funciones responden
        run: |
          for F in $FUNCIONES; do
            [ "$F" = login ] && continue
            R=$(curl -s -X POST "https://$REGION-$PROYECTO.cloudfunctions.net/$F" -H 'Content-Type: application/json' -d '{"data":{}}')
            echo "$F: $R"
            echo "$R" | grep -q 'UNAUTHENTICATED' || { echo "::error::$F no respondió"; exit 1; }
          done

      - name: Registro de errores (si algo falló)
        if: failure()
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND severity>=WARNING' \
            --limit 30 --freshness 1h --project "$PROYECTO" \
            --format='table[no-heading](timestamp,severity,resource.labels.service_name,textPayload,jsonPayload.message)' || true
